<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GoDice Magic</title>
    
    <!-- PWA 및 스마트폰 전체화면/상단바 제어 설정 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- 아이폰 상단바를 완전한 검은색으로 흡수 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        /* 주사위 카드 위치 조절용 스타일 */
        body.pos-top { justify-content: flex-start; padding-top: 60px; }
        body.pos-center { justify-content: center; }
        body.pos-bottom { justify-content: flex-end; padding-bottom: 80px; }

        /* 화면 전체 밝기 조절용 오버레이 */
        #brightnessOverlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #000000;
            opacity: 0;
            pointer-events: none;
            z-index: 999;
        }

        /* 상단 밝기 조절 바 (연결 후 터치 시 표시) */
        .brightness-control {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid #333;
            padding: 10px 20px;
            border-radius: 20px;
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            font-size: 0.8rem;
            color: #aaa;
        }

        .brightness-control input[type=range] {
            width: 120px;
            accent-color: #888;
        }

        /* 은밀 모드(스텔스) 전환 처리 */
        .ui-element {
            transition: opacity 0.8s ease, visibility 0.8s ease;
            opacity: 1;
            visibility: visible;
        }

        .stealth-active .ui-element {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        h1 { 
            margin-bottom: 20px; 
            font-size: 1.4rem; 
            letter-spacing: 1px; 
            color: #888888;
            margin-top: 0;
        }

        .dice-container {
            display: flex;
            flex-direction: row;
            gap: 25px;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 600px;
        }

        .dice-card {
            flex: 1;
            background-color: #080808;
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            border: 1px solid #1a1a1a;
            position: relative;
        }

        .black-card .dice-icon { color: #ffffff; }
        .blue-card .dice-icon { color: #448aff; }

        .label {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .black-card .label { color: #555555; }
        .blue-card .label { color: #1565c0; }

        .dice-icon {
            font-size: 5.5rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            height: 100px;
        }

        .dice-number {
            font-size: 3rem;
            font-weight: 800;
            color: #ffffff;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 25px;
            width: 100%;
            max-width: 320px;
        }

        button {
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-dual { background-color: #222222; border: 1px solid #444; }
        .btn-pos { background-color: #111111; color: #777; font-size: 0.8rem; border: 1px solid #222; }

        #statusText {
            margin-top: 15px;
            color: #555555;
            font-size: 0.85rem;
            text-align: center;
        }

        /* 하단 카피라이트 문구 */
        .copyright {
            position: fixed;
            bottom: 15px;
            font-size: 0.7rem;
            color: #444444;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body id="mainBody" class="pos-center">

    <!-- 밝기 조절 필터 레이어 -->
    <div id="brightnessOverlay"></div>

    <!-- 밝기 조절 슬라이더 (연결 후 터치 시 표시) -->
    <div class="brightness-control ui-element" id="brightnessControl">
        <span>☀️ 밝기</span>
        <input type="range" id="brightnessRange" min="10" max="100" value="100">
    </div>

    <h1 class="ui-element">🎲 GoDice Receiver</h1>

    <div class="dice-container">
        <!-- 검정 주사위 (왼쪽) -->
        <div class="dice-card black-card" id="card-K">
            <div class="label ui-element" id="label-K">BLACK</div>
            <div class="dice-icon" id="icon-K">⚀</div>
            <div class="dice-number" id="num-K">-</div>
        </div>

        <!-- 파란 주사위 (오른쪽) -->
        <div class="dice-card blue-card" id="card-B">
            <div class="label ui-element" id="label-B">BLUE</div>
            <div class="dice-icon" id="icon-B">⚀</div>
            <div class="dice-number" id="num-B">-</div>
        </div>
    </div>

    <div class="controls ui-element">
        <button id="btnConnectBoth" class="btn-dual">⚡ 주사위 연결하기</button>
        <button id="btnPosToggle" class="btn-pos">📐 위치: 중앙</button>
    </div>

    <div id="statusText" class="ui-element">주사위를 연결해 주세요.</div>

    <!-- 카피라이트 표시 -->
    <div class="copyright ui-element">Copyright © JH. All rights reserved.</div>

<script>
    const GODICE_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const GODICE_NOTIFY_CHAR_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

    const diceIcons = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

    const mainBody = document.getElementById('mainBody');
    const btnConnectBoth = document.getElementById('btnConnectBoth');
    const btnPosToggle = document.getElementById('btnPosToggle');
    const statusText = document.getElementById('statusText');
    const brightnessControl = document.getElementById('brightnessControl');
    const brightnessRange = document.getElementById('brightnessRange');
    const brightnessOverlay = document.getElementById('brightnessOverlay');

    let dicePrefix = 'GoDice';
    let connectedDevices = { 'K': null, 'B': null };
    let stealthTimer = null;

    // 위치 설정 (상단 -> 중앙 -> 하단)
    const positions = ['pos-center', 'pos-bottom', 'pos-top'];
    const posNames = { 'pos-top': '상단', 'pos-center': '중앙', 'pos-bottom': '하단' };
    let currentPosIdx = 0;

    btnPosToggle.addEventListener('click', () => {
        mainBody.classList.remove(positions[currentPosIdx]);
        currentPosIdx = (currentPosIdx + 1) % positions.length;
        const newPos = positions[currentPosIdx];
        mainBody.classList.add(newPos);
        btnPosToggle.innerText = `📐 위치: ${posNames[newPos]}`;
    });

    // 밝기 조절 슬라이더 로직
    brightnessRange.addEventListener('input', (e) => {
        const val = parseInt(e.target.value);
        brightnessOverlay.style.opacity = (100 - val) / 100;
    });

    // 안드로이드 OS용 시스템 상/하단바 숨김 전체화면 제어
    function requestFullScreenMode() {
        const docEl = document.documentElement;
        if (docEl.requestFullscreen) {
            docEl.requestFullscreen().catch(() => {});
        } else if (docEl.webkitRequestFullscreen) {
            docEl.webkitRequestFullscreen();
        }
    }

    // 스텔스 타이머 (3초 후 UI 페이드아웃)
    function startStealthTimer() {
        clearTimeout(stealthTimer);
        stealthTimer = setTimeout(() => {
            if (connectedDevices['K'] || connectedDevices['B']) {
                mainBody.classList.add('stealth-active');
            }
        }, 3000);
    }

    // 화면 아무 곳이나 터치 시 전체화면 시도 및 UI 복원
    mainBody.addEventListener('click', (e) => {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
        
        // 터치 시 안드로이드 네비게이션/상단바 숨김 처리
        requestFullScreenMode();

        if (mainBody.classList.contains('stealth-active')) {
            mainBody.classList.remove('stealth-active');
            startStealthTimer();
        }
    });

    function toSignedByte(byteVal) {
        return byteVal >= 128 ? byteVal - 256 : byteVal;
    }

    function calculateDiceFace(x, y, z) {
        const absX = Math.abs(x), absY = Math.abs(y), absZ = Math.abs(z);
        if (absX >= absY && absX >= absZ) return x < 0 ? 1 : 6;
        else if (absY >= absX && absY >= absZ) return y > 0 ? 3 : 4;
        else return z > 0 ? 2 : 5;
    }

    async function connectBothDice() {
        statusText.innerText = '주사위를 선택해 주세요...';
        await requestAndConnectOne();
        if (!connectedDevices['K'] || !connectedDevices['B']) {
            await requestAndConnectOne();
        }
    }

    async function requestAndConnectOne() {
        try {
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: dicePrefix }],
                optionalServices: [GODICE_SERVICE_UUID]
            });

            const upperName = device.name ? device.name.toUpperCase() : '';
            let type = null;

            if (upperName.includes('_K')) {
                type = 'K';
            } else if (upperName.includes('_B')) {
                type = 'B';
            } else {
                type = !connectedDevices['K'] ? 'K' : (!connectedDevices['B'] ? 'B' : null);
            }

            if (!type) return;

            if (connectedDevices[type]) {
                statusText.innerText = `이미 ${type === 'K' ? '검정(K)' : '파랑(B)'} 주사위가 연결되어 있습니다.`;
                return;
            }

            await connectToDiceGATT(device, type);

        } catch (err) {
            if (err.name !== 'NotFoundError') statusText.innerText = `오류: ${err.message}`;
        }
    }

    async function connectToDiceGATT(device, type) {
        const icon = document.getElementById(`icon-${type}`);
        const num = document.getElementById(`num-${type}`);
        const labelEl = document.getElementById(`label-${type}`);

        try {
            statusText.innerText = `${device.name} 연결 중...`;
            const server = await device.gatt.connect();
            
            const service = await server.getPrimaryService(GODICE_SERVICE_UUID);
            const characteristic = await service.getCharacteristic(GODICE_NOTIFY_CHAR_UUID);
            await characteristic.startNotifications();

            connectedDevices[type] = device;
            labelEl.innerText = type === 'K' ? 'BLACK' : 'BLUE';

            statusText.innerText = `✅ ${device.name} 연결 완료`;

            if (connectedDevices['K'] && connectedDevices['B']) {
                statusText.innerText = '모든 주사위 연결 완료!';
                btnConnectBoth.style.display = 'none';
                btnPosToggle.style.display = 'none';
                brightnessControl.style.display = 'flex';
                
                // 두 개 다 연결된 직후 전체화면 모드 진입
                requestFullScreenMode();
            }
            
            startStealthTimer();

            characteristic.addEventListener('characteristicvaluechanged', (event) => {
                const dataView = event.target.value;
                if (dataView.byteLength < 5) return;

                const x = toSignedByte(dataView.getUint8(2));
                const y = toSignedByte(dataView.getUint8(3));
                const z = toSignedByte(dataView.getUint8(4));

                const diceVal = calculateDiceFace(x, y, z);

                if (diceVal >= 1 && diceVal <= 6) {
                    icon.innerText = diceIcons[diceVal];
                    num.innerText = diceVal;
                }
            });

            device.addEventListener('gattserverdisconnected', () => {
                connectedDevices[type] = null;
                icon.innerText = '⚀';
                num.innerText = '-';
                mainBody.classList.remove('stealth-active');
                btnConnectBoth.style.display = 'block';
                btnPosToggle.style.display = 'block';
                brightnessControl.style.display = 'none';
                statusText.innerText = '연결이 해제되었습니다.';
            });

        } catch (err) {
            statusText.innerText = `연결 실패: ${err.message}`;
        }
    }

    btnConnectBoth.addEventListener('click', connectBothDice);
</script>

</body>
</html>
