<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GoDice Magic</title>
    
    <!-- PWA 및 전체화면 실행 설정 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            user-select: none;
        }

        /* 은밀 모드(스텔스) 전환 처리 */
        .ui-element {
            transition: opacity 0.8s ease, visibility 0.8s ease;
            opacity: 1;
            visibility: visible;
        }

        .stealth-active .ui-element {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        h1 { 
            margin-bottom: 20px; 
            font-size: 1.5rem; 
            letter-spacing: 1px; 
            color: #888888;
        }

        .dice-container {
            display: flex;
            flex-direction: row;
            gap: 25px;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 600px;
        }

        .dice-card {
            flex: 1;
            background-color: #080808;
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            border: 1px solid #1a1a1a;
            position: relative;
        }

        .black-card .dice-icon { color: #ffffff; }
        .blue-card .dice-icon { color: #448aff; }

        .label {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .black-card .label { color: #555555; }
        .blue-card .label { color: #1565c0; }

        .dice-icon {
            font-size: 5.5rem;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            height: 100px;
        }

        .dice-number {
            font-size: 3rem;
            font-weight: 800;
            color: #ffffff;
        }

        /* 은밀한 어두운 배터리 정보 표시 */
        .battery-info {
            font-size: 0.75rem;
            color: #333333; /* 관객 눈에 띄지 않도록 아주 어두운 텍스트 */
            margin-top: 8px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 25px;
            width: 100%;
            max-width: 320px;
        }

        button {
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-dual { background-color: #222222; border: 1px solid #444; }
        .btn-setting { background-color: #111111; color: #666; font-size: 0.8rem; border: 1px solid #222; }

        #statusText {
            margin-top: 15px;
            color: #555555;
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body id="mainBody">

    <h1 class="ui-element">🎲 GoDice Receiver</h1>

    <div class="dice-container">
        <!-- 검정 주사위 (왼쪽) -->
        <div class="dice-card black-card" id="card-K">
            <div class="label ui-element" id="label-K">BLACK</div>
            <div class="dice-icon" id="icon-K">⚀</div>
            <div class="dice-number" id="num-K">-</div>
            <div class="battery-info" id="bat-K">⚡ - %</div>
        </div>

        <!-- 파란 주사위 (오른쪽) -->
        <div class="dice-card blue-card" id="card-B">
            <div class="label ui-element" id="label-B">BLUE</div>
            <div class="dice-icon" id="icon-B">⚀</div>
            <div class="dice-number" id="num-B">-</div>
            <div class="battery-info" id="bat-B">⚡ - %</div>
        </div>
    </div>

    <div class="controls ui-element">
        <button id="btnConnectBoth" class="btn-dual">⚡ 주사위 연결하기</button>
        <button id="btnSettings" class="btn-setting">⚙️ 주사위 모델/이름 설정</button>
    </div>

    <div id="statusText" class="ui-element">주사위를 연결해 주세요.</div>

<script>
    const GODICE_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
    const GODICE_NOTIFY_CHAR_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
    
    // 블루투스 표준 배터리 서비스 UUID
    const BATTERY_SERVICE_UUID = 0x180F;
    const BATTERY_LEVEL_CHAR_UUID = 0x2A19;

    const diceIcons = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

    const mainBody = document.getElementById('mainBody');
    const btnConnectBoth = document.getElementById('btnConnectBoth');
    const btnSettings = document.getElementById('btnSettings');
    const statusText = document.getElementById('statusText');

    let dicePrefix = localStorage.getItem('godice_prefix') || 'GoDice';
    let connectedDevices = { 'K': null, 'B': null };
    let stealthTimer = null;

    // 모델명 및 키워드 설정 버튼
    btnSettings.addEventListener('click', () => {
        const newPrefix = prompt("주사위 모델명/검색 키워드를 입력하세요:\n(시리얼 번호가 바뀌어도 앞 이름만 같으면 인식됩니다)", dicePrefix);
        if (newPrefix !== null && newPrefix.trim() !== "") {
            dicePrefix = newPrefix.trim();
            localStorage.setItem('godice_prefix', dicePrefix);
            alert(`검색 키워드가 '${dicePrefix}'(으)로 변경되었습니다.`);
        }
    });

    // 스텔스 타이머 (모두 연결 후 3초 뒤 화면 요소 페이드아웃)
    function startStealthTimer() {
        clearTimeout(stealthTimer);
        stealthTimer = setTimeout(() => {
            if (connectedDevices['K'] || connectedDevices['B']) {
                mainBody.classList.add('stealth-active');
            }
        }, 3000);
    }

    // 은밀 모드 상태에서 화면 아무 곳이나 터치하면 잠시 UI 복원
    mainBody.addEventListener('click', (e) => {
        if (e.target.tagName === 'BUTTON') return;
        if (mainBody.classList.contains('stealth-active')) {
            mainBody.classList.remove('stealth-active');
            startStealthTimer();
        }
    });

    function toSignedByte(byteVal) {
        return byteVal >= 128 ? byteVal - 256 : byteVal;
    }

    function calculateDiceFace(x, y, z) {
        const absX = Math.abs(x), absY = Math.abs(y), absZ = Math.abs(z);
        if (absX >= absY && absX >= absZ) return x < 0 ? 1 : 6;
        else if (absY >= absX && absY >= absZ) return y > 0 ? 3 : 4;
        else return z > 0 ? 2 : 5;
    }

    async function connectBothDice() {
        statusText.innerText = `'${dicePrefix}' 키워드로 검색 중... 주사위를 선택해 주세요.`;
        await requestAndConnectOne();
        if (!connectedDevices['K'] || !connectedDevices['B']) {
            await requestAndConnectOne();
        }
    }

    async function requestAndConnectOne() {
        try {
            const device = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: dicePrefix }],
                optionalServices: [GODICE_SERVICE_UUID, BATTERY_SERVICE_UUID]
            });

            // 중간 시리얼 번호(8A0F87 등)에 관계없이 _K 및 _B 자동 판별
            const upperName = device.name ? device.name.toUpperCase() : '';
            let type = null;

            if (upperName.includes('_K')) {
                type = 'K'; // 검정 주사위 -> 왼쪽
            } else if (upperName.includes('_B')) {
                type = 'B'; // 파랑 주사위 -> 오른쪽
            } else {
                // 특정 구분이 없는 예외 모델의 경우 빈자리에 순서대로 할당
                type = !connectedDevices['K'] ? 'K' : (!connectedDevices['B'] ? 'B' : null);
            }

            if (!type) return;

            if (connectedDevices[type]) {
                statusText.innerText = `이미 ${type === 'K' ? '검정(K)' : '파랑(B)'} 주사위가 연결되어 있습니다.`;
                return;
            }

            await connectToDiceGATT(device, type);

        } catch (err) {
            if (err.name !== 'NotFoundError') statusText.innerText = `오류: ${err.message}`;
        }
    }

    async function connectToDiceGATT(device, type) {
        const icon = document.getElementById(`icon-${type}`);
        const num = document.getElementById(`num-${type}`);
        const batEl = document.getElementById(`bat-${type}`);
        const labelEl = document.getElementById(`label-${type}`);

        try {
            statusText.innerText = `${device.name} 연결 중...`;
            const server = await device.gatt.connect();
            
            // 1. 주사위 신호 수신
            const service = await server.getPrimaryService(GODICE_SERVICE_UUID);
            const characteristic = await service.getCharacteristic(GODICE_NOTIFY_CHAR_UUID);
            await characteristic.startNotifications();

            // 2. 배터리 잔량 조회
            try {
                const batService = await server.getPrimaryService(BATTERY_SERVICE_UUID);
                const batChar = await batService.getCharacteristic(BATTERY_LEVEL_CHAR_UUID);
                const batValue = await batChar.readValue();
                const batteryLevel = batValue.getUint8(0);
                batEl.innerText = `⚡ ${batteryLevel}%`;
            } catch (batErr) {
                batEl.innerText = `⚡ --%`;
            }

            connectedDevices[type] = device;
            labelEl.innerText = type === 'K' ? 'BLACK' : 'BLUE';

            statusText.innerText = `✅ ${device.name} 연결 완료`;

            if (connectedDevices['K'] && connectedDevices['B']) {
                statusText.innerText = '모든 주사위 연결 완료! 잠시 후 화면이 숨겨집니다.';
                btnConnectBoth.style.display = 'none';
            }
            
            startStealthTimer();

            characteristic.addEventListener('characteristicvaluechanged', (event) => {
                const dataView = event.target.value;
                if (dataView.byteLength < 5) return;

                const x = toSignedByte(dataView.getUint8(2));
                const y = toSignedByte(dataView.getUint8(3));
                const z = toSignedByte(dataView.getUint8(4));

                const diceVal = calculateDiceFace(x, y, z);

                if (diceVal >= 1 && diceVal <= 6) {
                    icon.innerText = diceIcons[diceVal];
                    num.innerText = diceVal;
                }
            });

            device.addEventListener('gattserverdisconnected', () => {
                connectedDevices[type] = null;
                icon.innerText = '⚀';
                num.innerText = '-';
                batEl.innerText = '⚡ - %';
                mainBody.classList.remove('stealth-active');
                btnConnectBoth.style.display = 'block';
                statusText.innerText = '연결이 해제되었습니다.';
            });

        } catch (err) {
            statusText.innerText = `연결 실패: ${err.message}`;
        }
    }

    btnConnectBoth.addEventListener('click', connectBothDice);
</script>

</body>
</html>
